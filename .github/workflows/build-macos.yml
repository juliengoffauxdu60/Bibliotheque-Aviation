# Build macOS — Recherche POH (Electron)
#
# Dépôt : juliengoffauxdu60/Recherche-POH (privé). Chaque push sur main
# produira le DMG macOS universel (Apple Silicon + Intel) en artefact.
# Le DMG n'est ni signé ni notarié (pas de compte Apple Developer) : à la
# première ouverture sur un Mac, faire clic droit puis Ouvrir.
name: Build macOS

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur de recherche
        run: npm test

      - name: Construire le DMG macOS
        run: npm run dist:mac

      - name: Publier le DMG (.dmg + .blockmap)
        uses: actions/upload-artifact@v4
        with:
          name: recherche-poh-macos
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error
