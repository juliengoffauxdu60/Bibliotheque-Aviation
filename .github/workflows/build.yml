# Build — Bibliothèque Aviation (Electron)
#
# Dépôt : juliengoffauxdu60/Bibliotheque-Aviation (privé). Quatre jobs en
# série : création de la Release en brouillon, Windows construit et envoie
# son installateur, macOS construit et envoie ses DMG, puis UN SEUL job
# publie la Release. ZÉRO artefact Actions — voir ci-dessous.
#
# POURQUOI PLUS AUCUN ARTEFACT (v1.2.4, 17 nov. 2026) : le quota gratuit
# des artefacts Actions est de 500 Mo. Chaque run téléverse ~450-545 Mo
# (Windows ~150 Mo + macOS ~310-370 Mo), et chaque version déclenche
# DEUX runs (push + tag), soit ~900 Mo : le quota est dépassé à chaque
# version. Le 16 nov., 52 artefacts (13 206 Mo) ont été supprimés, mais
# le compteur d'usage GitHub n'a TOUJOURS pas recalculé ~32 h après
# (0 artefact, 0 octet vérifiés par API) : chaque run échoue depuis à
# l'étape d'upload d'artefact (« Artifact storage quota has been hit »),
# alors que les tests et la construction des installateurs réussissent.
# Les installateurs ne transitent donc plus par les artefacts : chaque
# job de build les envoie DIRECTEMENT dans la Release avec
# `gh release upload`. Le quota des artefacts ne peut plus rien bloquer.
#
# POURQUOI CET ORDRE (leçon des v1.0.0 / v1.1.0, 14 nov. 2026) :
# electron-builder NE PUBLIE JAMAIS — son publieur GitHub crée la
# Release en parallèle dans chaque tâche et se marche dessus (v1.0.0 a
# eu DEUX Releases, v1.1.0 a perdu son DMG x64 écrasé par l'arm64, un
# job a échoué en 422 « Release already_exists »). Donc --publish never
# partout, et c'est ce workflow qui crée la Release UNE fois, en
# brouillon, AVANT les builds (`create-release`), puis chaque build
# envoie ses fichiers dedans (`gh release upload --clobber`), puis UN
# SEUL job la publie (`gh release edit --draft=false`). Les jobs de
# build dépendent du job de création (`needs`) pour que la Release
# existe avant tout envoi ; `build-macos` dépend de `build-windows`
# comme avant. Chaque job `gh` fait un checkout en première étape :
# `gh` a besoin d'un dépôt git local pour déterminer le dépôt (sans
# lui, « fatal: not a git repository », vécu le 14 nov.).
#
# REPRISES SANS RISQUE : si un run est relancé (« Re-run failed
# jobs »), la création retrouve la Release existante (`gh release view`,
# pas de 422) et les envois écrasent les fichiers déjà présents
# (`--clobber`). Les runs sur main sans tag ne font que construire et
# tester : les étapes Release sont ignorées (`if: startsWith(...)`).
#
# POURQUOI LA SIGNATURE AD-HOC (14 nov. 2026) : sans signature, macOS
# sur Apple Silicon dit que l'appli « est endommagée » et n'offre AUCUN
# bouton dans les Réglages — il faut Terminal, inacceptable pour les
# gens de la classe. `identity: "-"` signe ad-hoc (gratuit, sans compte
# Apple Developer) et `hardenedRuntime: false` évite le rejet des
# frameworks Electron pré-signés par la validation de bibliothèques.
# Résultat : téléchargée, l'appli s'ouvre par clic droit puis Ouvrir ;
# copiée depuis une clé USB (sans quarantaine), elle s'ouvre directement.
# La signature parfaite (Developer ID + notarisation, zéro message)
# demanderait un compte Apple Developer payant — pas en place.
#
# MISE À JOUR AUTOMATIQUE (v1.2.5, 17 nov. 2026) : la Release contient
# aussi les fichiers du flux de l'updater — latest.yml (Windows),
# latest-mac.yml + les ZIP Mac (macOS, cible zip ajoutée) — envoyés par
# les mêmes `gh release upload`, toujours ZÉRO artefact. L'appli lit
# ces fichiers en HTTPS anonyme (aucun jeton dans l'appli) ; sur macOS
# l'installation est maison (remplacement du .app, Squirrel refuse les
# signatures ad-hoc) — voir main/update-feed.js et main/mac-update.js.
# Les ZIP et les latest-*.yml sont des assets de Release : ils ne
# comptent pas dans le quota des artefacts Actions.
#
# Chaque tag v* publie une Release GitHub avec l'exe et les DMG en
# téléchargement direct. Pas de DMG universel : le fusionneur
# d'electron-builder refuse le module natif canvas
# (@napi-rs/canvas-darwin-arm64), identique dans les deux builds et non
# couvert par une règle x64ArchFiles — donc deux DMG séparés, arm64
# (Apple Silicon) et x64 (Intel).
name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Créer la Release en brouillon
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "La release ${{ github.ref_name }} existe déjà, on la réutilise."
          else
            gh release create "${{ github.ref_name }}" --draft \
              --title "${{ github.ref_name }}" \
              --notes "Bibliothèque Aviation — recherche plein texte dans les documents d'aviation (POH, AIM, RAC)."
          fi

  build-windows:
    runs-on: windows-latest
    needs: create-release
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur de recherche
        run: npm test

      - name: Construire l'installateur Windows
        run: npm run dist

      - name: Envoyer l'installateur et le flux de mise à jour vers la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.exe dist/*.blockmap dist/latest.yml --clobber

  build-macos:
    runs-on: macos-latest
    needs: build-windows
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur de recherche
        run: npm test

      - name: Construire les DMG et ZIP macOS
        run: npm run dist:mac

      - name: Envoyer les DMG, ZIP et le flux de mise à jour vers la Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml --clobber

  publish-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Publier la Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
