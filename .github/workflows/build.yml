# Build — Bibliothèque Aviation (Electron)
#
# Dépôt : juliengoffauxdu60/Bibliotheque-Aviation (privé). Trois jobs en série :
# Windows construit, macOS construit, puis UN SEUL job publie la Release.
#
# POURQUOI ELECTRON-BUILDER NE PUBLIE JAMAIS (leçon des v1.0.0 / v1.1.0,
# 14 nov. 2026) : son publieur GitHub crée la Release en parallèle dans
# chaque tâche et se marche dessus — v1.0.0 a eu DEUX Releases (actifs
# partagés, un blockmap dans la mauvaise), v1.1.0 aussi (le DMG arm64 a
# écrasé le DMG x64 sous le même nom, le DMG x64 a disparu), et un job
# macOS a échoué en 422 « Release already_exists ». Même le `needs`
# n'a pas suffi : les tâches d'un même job publient en parallèle. Donc
# --publish never partout, et c'est le job `release` qui crée la Release
# UNE fois, avec `gh release create`, à partir des artefacts des deux
# builds. Le job `release` fait un checkout : `gh` a besoin d'un dépôt
# git local pour déterminer le dépôt (sans lui, « fatal: not a git
# repository », vécu le 14 nov.). Les runs sur main ne font que construire
# (le job `release` ne tourne que sur un tag v*).
#
# POURQUOI LA SIGNATURE AD-HOC (même jour) : sans signature, macOS sur
# Apple Silicon dit que l'appli « est endommagée » et n'offre AUCUN
# bouton dans les Réglages — il faut Terminal, inacceptable pour les
# gens de la classe. `identity: "-"` signe ad-hoc (gratuit, sans compte
# Apple Developer) et `hardenedRuntime: false` évite le rejet des
# frameworks Electron pré-signés par la validation de bibliothèques.
# Résultat : téléchargée, l'appli s'ouvre par clic droit puis Ouvrir ;
# copiée depuis une clé USB (sans quarantaine), elle s'ouvre directement.
# La signature parfaite (Developer ID + notarisation, zéro message)
# demanderait un compte Apple Developer payant — pas en place.
#
# Chaque push sur main produit les installateurs en artefacts. Chaque tag
# v* publie en plus une Release GitHub avec l'exe et les DMG en
# téléchargement direct. Pas de DMG universel : le fusionneur
# d'electron-builder refuse le module natif canvas
# (@napi-rs/canvas-darwin-arm64), identique dans les deux builds et non
# couvert par une règle x64ArchFiles — donc deux DMG séparés, arm64
# (Apple Silicon) et x64 (Intel).
name: Build

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur de recherche
        run: npm test

      - name: Construire l'installateur Windows
        run: npm run dist

      - name: Publier l'installateur (.exe + .blockmap)
        uses: actions/upload-artifact@v4
        with:
          name: bibliotheque-aviation-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    needs: build-windows
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tests du moteur de recherche
        run: npm test

      - name: Construire les DMG macOS
        run: npm run dist:mac

      - name: Publier les DMG (.dmg + .blockmap)
        uses: actions/upload-artifact@v4
        with:
          name: bibliotheque-aviation-macos
          path: |
            dist/*.dmg
            dist/*.blockmap
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer les installateurs Windows
        uses: actions/download-artifact@v4
        with:
          name: bibliotheque-aviation-windows
          path: dist-win

      - name: Récupérer les DMG macOS
        uses: actions/download-artifact@v4
        with:
          name: bibliotheque-aviation-macos
          path: dist-mac

      - name: Créer la Release avec tous les installateurs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --notes "Bibliothèque Aviation — recherche plein texte dans les documents d'aviation (POH, AIM, RAC)." \
            dist-win/*.exe dist-win/*.blockmap \
            dist-mac/*.dmg dist-mac/*.blockmap
